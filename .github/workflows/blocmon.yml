name: BlocMon CI

on:
  push:
    paths: ["blocmon/**", ".github/workflows/blocmon.yml"]
  pull_request:
    paths: ["blocmon/**", ".github/workflows/blocmon.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blocmon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Tests unitaires
        run: gradle :app:testDebugUnitTest
      - name: Compilation de l'APK debug
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: blocmon-debug-apk
          path: blocmon/app/build/outputs/apk/debug/app-debug.apk
